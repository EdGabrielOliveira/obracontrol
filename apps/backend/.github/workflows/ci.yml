name: CI Backend

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: file:./prisma/dev.db
      TEST_DATABASE_URL: file:./prisma/test.db
      OBJECT_STORAGE_DIR: .local-objects
      BETTER_AUTH_SECRET: ci-only-secret-for-obracontrol-tests-0123456789abcdef
      ADMIN_REGISTRATION_KEY: ci-only-admin-registration-key-0123456789
      FRONTEND_ORIGIN: http://localhost:7001
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Local-equivalent validation
        run: bun run ci:verify

      - name: Build runtime artifact
        run: bun build --compile --minify-whitespace --minify-syntax --target bun --outfile /tmp/obracontrol-server src/index.ts
