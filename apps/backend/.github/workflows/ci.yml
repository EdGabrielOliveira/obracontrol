name: CI Backend

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: obracontrol
          POSTGRES_USER: obracontrol
          POSTGRES_PASSWORD: obracontrol_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obracontrol -d obracontrol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://obracontrol:obracontrol_ci@localhost:5432/obracontrol?schema=public
      TEST_DATABASE_URL: postgresql://obracontrol:obracontrol_ci@localhost:5432/obracontrol_test?schema=public
      OBJECT_STORAGE_DIR: .local-objects
      BETTER_AUTH_SECRET: ci-only-secret-for-obracontrol-tests-0123456789abcdef
      ADMIN_REGISTRATION_KEY: ci-only-admin-registration-key-0123456789
      FRONTEND_ORIGIN: http://localhost:7001
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Local-equivalent validation
        run: bun run ci:verify

      - name: Build runtime artifact
        run: bun build --compile --minify-whitespace --minify-syntax --target bun --outfile /tmp/obracontrol-server src/index.ts
