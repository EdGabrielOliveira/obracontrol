map $http_x_forwarded_proto $obracontrol_forwarded_proto {
	default $http_x_forwarded_proto;
	"" $scheme;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	include /etc/nginx/mime.types;

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Healthcheck próprio da SPA. Mantém o container verificável quando a API
	# está em outro domínio ou em outro Compose (como no cPanel).
	location = /healthz {
		default_type application/json;
		return 200 '{"status":"ok"}';
	}

	# Keep browser requests same-origin. The SPA fallback must never handle
	# backend paths, so cookies and API calls remain on the public origin.
	location ~ ^/(api|admin|api-keys|audit-logs|construction|governance|health|internal|openapi|organizations|users)(/|$) {
		resolver 127.0.0.11 ipv6=off valid=10s;
		set $api_upstream ${API_UPSTREAM};
		proxy_pass $api_upstream;
		proxy_http_version 1.1;
		client_max_body_size 20m;
		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $obracontrol_forwarded_proto;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
		# Sessões e respostas da API nunca devem ser reutilizadas pelo cache do navegador.
		add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
		add_header Pragma "no-cache" always;
		add_header Expires "0" always;
		proxy_no_cache 1;
		proxy_cache_bypass 1;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
