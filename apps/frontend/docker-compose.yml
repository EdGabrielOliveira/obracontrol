# Um único Compose para desenvolvimento via Docker e produção no cPanel.
# Ajuste apenas o arquivo .env de cada ambiente. Em produção, o Apache/cPanel
# encaminha o subdomínio web para 127.0.0.1:${WEB_PORT}.
# No monorepo, prefira executar o Compose pela raiz.
services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Defina VITE_SERVER_URL no arquivo .env}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-7000}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
