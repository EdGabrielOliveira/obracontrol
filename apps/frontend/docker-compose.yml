# Um único Compose para desenvolvimento via Docker e produção no cPanel.
# Ajuste apenas o arquivo .env de cada ambiente. Em produção, o Apache/cPanel
# encaminha o subdomínio web para 127.0.0.1:${WEB_PORT}.
# No monorepo, prefira executar o Compose pela raiz.
services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      # Usa a rede do host apenas durante o build para resolver o DNS da VPS.
      network: host
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Defina VITE_SERVER_URL no arquivo .env}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-7000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
