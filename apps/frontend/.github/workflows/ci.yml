name: CI Frontend

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: obracontrol
          POSTGRES_USER: obracontrol
          POSTGRES_PASSWORD: obracontrol_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obracontrol -d obracontrol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://obracontrol:obracontrol_ci@localhost:5432/obracontrol?schema=public
      TEST_DATABASE_URL: postgresql://obracontrol:obracontrol_ci@localhost:5432/obracontrol_test?schema=public
      OBJECT_STORAGE_DIR: .local-objects
      BETTER_AUTH_SECRET: ci-only-secret-for-obracontrol-tests-0123456789abcdef
      FRONTEND_ORIGIN: http://localhost:7001
      OBRACONTROL_BACKEND_DIR: ./obracontrol-backend
      BACKEND_REPO_TOKEN_AVAILABLE: ${{ secrets.BACKEND_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend for Playwright webServer
        if: env.BACKEND_REPO_TOKEN_AVAILABLE == 'true'
        uses: actions/checkout@v4
        with:
          repository: EdGabrielOliveira/obracontrol-backend
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          path: obracontrol-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install backend dependencies
        if: env.BACKEND_REPO_TOKEN_AVAILABLE == 'true'
        working-directory: obracontrol-backend
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (backend)
        if: env.BACKEND_REPO_TOKEN_AVAILABLE == 'true'
        working-directory: obracontrol-backend
        run: |
          bun prisma validate
          bun run db:generate

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Static checks
        run: |
          bun run check
          bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Install Playwright browser
        if: env.BACKEND_REPO_TOKEN_AVAILABLE == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Browser E2E (Playwright + real backend)
        if: env.BACKEND_REPO_TOKEN_AVAILABLE == 'true'
        run: bunx playwright test

      - name: Report skipped Browser E2E
        if: env.BACKEND_REPO_TOKEN_AVAILABLE != 'true'
        run: echo "BACKEND_REPO_TOKEN is not configured; Browser E2E was skipped."

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
