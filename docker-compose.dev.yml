# Override local: mantém o Dockerfile/Nginx de produção intacto e inicia o
# servidor Vite com o código-fonte montado para hot reload.
services:
  frontend:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_BACKEND_TARGET: http://backend:7001
      VITE_USE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_CLIENT_PORT: "${FRONTEND_PORT:-7000}"
    ports: !override
      - "${FRONTEND_PORT:-7000}:7000"
    volumes:
      - type: bind
        source: ./apps/frontend
        target: /app
        consistency: delegated
      - type: volume
        source: frontend_node_modules
        target: /app/node_modules
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/ | grep -q '<!doctype html>' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  frontend_node_modules:
